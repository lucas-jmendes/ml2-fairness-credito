[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faircredit"
version = "0.1.0"
description = "Comitês heterogêneos otimizados em múltiplos objetivos para crédito justo sem atributos sensíveis"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
